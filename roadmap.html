function aiExec(c){
  if(c.badArgs) return {id:c.id,name:c.name,isError:true,content:'Error: the arguments were not valid JSON. Call the tool again.'};
  try{
    const fn=AI_IMPL[c.name]; if(!fn) throw new Error('Unknown tool '+c.name);
    const a=c.input&&typeof c.input==='object'?c.input:{};
    return {id:c.id,name:c.name,content:JSON.stringify(fn(a))};
  }catch(e){ return {id:c.id,name:c.name,isError:true,content:'Error: '+e.message}; }
}

/* ---------- provider adapters: same tools, two wire formats ---------- */
function AiError(kind,msg){this.kind=kind;this.message=msg;}
async function loadAnthropic(){
  if(!AnthropicSDK){
    try{ AnthropicSDK=(await import(AI_SDK_URL)).default; }
    catch(e){ throw new AiError('net','Could not load the Anthropic SDK from cdn.jsdelivr.net. Check your internet connection.'); }
  }
  return AnthropicSDK;
}
const ADAPTERS={
  anthropic:{
    pushUser:function(conv,text){conv.msgs.push({role:'user',content:text});},
    pushResults:function(conv,res){conv.msgs.push({role:'user',content:res.map(function(r){const o={type:'tool_result',tool_use_id:r.id,content:r.content}; if(r.isError) o.is_error=true; return o;})});},
    step:async function(a,conv,signal){
      const Anthropic=await loadAnthropic();
      const client=new Anthropic({apiKey:a.key,dangerouslyAllowBrowser:true,maxRetries:2});
      const params={model:a.model,max_tokens:16000,system:AI_SYSTEM,cache_control:{type:'ephemeral'},
        tools:AI_TOOLS.map(function(t){return {name:t.name,description:t.description,input_schema:t.parameters};}),messages:conv.msgs};
      // effort exists on current Claude models; older ones reject it
      if(/^claude-(opus-(5|4-[5-8])|fable|mythos|sonnet-5|haiku-5)/.test(a.model)) params.output_config={effort:'medium'};
      // server-side refusal fallback: the API retries on another model if a safety classifier declines
      const fb=!aiNoFallback&&/^claude-(fable-5-[12]|opus-5(-5)?|sonnet-5-5)$/.test(a.model);
      let r;
      try{
        try{
          r=fb?await client.beta.messages.create(Object.assign({betas:['server-side-fallback-2026-07-01'],fallbacks:'default'},params),{signal:signal})
              :await client.messages.create(params,{signal:signal});
        }catch(e){
          if(fb&&e instanceof Anthropic.BadRequestError){ aiNoFallback=true; r=await client.messages.create(params,{signal:signal}); }
          else throw e;
        }
      }catch(e){
        if(e instanceof Anthropic.APIUserAbortError) throw new AiError('abort','Stopped.');
        if(e instanceof Anthropic.AuthenticationError) throw new AiError('auth','The API key was not accepted. Check it in AI settings.');
        if(e instanceof Anthropic.PermissionDeniedError) throw new AiError('auth','This key may not use '+a.model+'.');
        if(e instanceof Anthropic.NotFoundError) throw new AiError('model','Model "'+a.model+'" was not found. Check the model name in AI settings.');
        if(e instanceof Anthropic.RateLimitError) throw new AiError('rate','Rate limit reached. Wait a minute and try again.');
        if(e instanceof Anthropic.BadRequestError) throw new AiError('other','The request was rejected: '+e.message);
        if(e instanceof Anthropic.APIConnectionError) throw new AiError('net','Could not reach the Anthropic API. Check your connection.');
        if(e instanceof Anthropic.APIError) throw new AiError('other','API error '+(e.status||'')+': '+e.message);
        throw e;
      }
      conv.msgs.push({role:'assistant',content:r.content});
      const calls=[], texts=[];
      r.content.forEach(function(b){ if(b.type==='tool_use') calls.push({id:b.id,name:b.name,input:b.input}); else if(b.type==='text'&&b.text.trim()) texts.push(b.text.trim()); });
      const sr=r.stop_reason;
      return {text:texts.join('\n\n'),calls:calls,model:r.model,
        stop:sr==='tool_use'?'tool':sr==='pause_turn'?'pause':sr==='refusal'?'refusal':sr==='max_tokens'?'max':'end'};
    }
  },
  openai:{
    pushUser:function(conv,text){conv.msgs.push({role:'user',content:text});},
    pushResults:function(conv,res){res.forEach(function(r){conv.msgs.push({role:'tool',tool_call_id:r.id,content:r.content});});},
    step:async function(a,conv,signal){
      const headers={'Content-Type':'application/json'};
      if(a.key) headers.Authorization='Bearer '+a.key;
      const body={model:a.model,messages:[{role:'system',content:AI_SYSTEM}].concat(conv.msgs),
        tools:AI_TOOLS.map(function(t){return {type:'function',function:{name:t.name,description:t.description,parameters:t.parameters}};}),tool_choice:'auto'};
      let res;
      try{ res=await fetch(a.base+'/chat/completions',{method:'POST',headers:headers,body:JSON.stringify(body),signal:signal}); }
      catch(e){
        if(signal.aborted) throw new AiError('abort','Stopped.');
        throw new AiError('net','Could not reach '+a.base+'. Check the address and your connection. If the address is right, this provider may block requests from web pages (CORS)'+(a.p.id==='ollama'?'; start Ollama with OLLAMA_ORIGINS=* set.':'; OpenRouter is an alternative that allows them.'));
      }
      let data=null; try{ data=await res.json(); }catch(e){}
      if(!res.ok){
        const msg=(data&&(data.error&&(data.error.message||data.error)||data.message))||res.statusText;
        const m=typeof msg==='string'?msg:JSON.stringify(msg);
        if(res.status===401||res.status===403) throw new AiError('auth','The API key was not accepted ('+res.status+'): '+m);
        if(res.status===404) throw new AiError('model','Not found (404). Check the model name and API address: '+m);
        if(res.status===429) throw new AiError('rate','Rate limit or quota reached: '+m);
        throw new AiError('other','API error '+res.status+': '+m);
      }
      const ch=data&&data.choices&&data.choices[0];
      if(!ch||!ch.message) throw new AiError('other','The API sent back an empty answer.');
      const msg=ch.message, tc=(msg.tool_calls||[]).filter(function(t){return t&&t.function;});
      const keep={role:'assistant',content:msg.content==null?'':msg.content}; if(tc.length) keep.tool_calls=tc;
      conv.msgs.push(keep);
      const calls=tc.map(function(t){ let input=null,bad=false; try{input=JSON.parse(t.function.arguments||'{}');}catch(e){bad=true;} return {id:t.id,name:t.function.name,input:input,badArgs:bad}; });
      const fr=ch.finish_reason;
      return {text:typeof msg.content==='string'?msg.content.trim():'',calls:calls,model:data.model||a.model,
        stop:tc.length?'tool':fr==='length'?'max':fr==='content_filter'?'refusal':'end'};
    }
  }
};

/* ---------- running a turn ---------- */
function aiProgress(a){
  const ul=h('ul',{class:'ai-log'}); aiChanges.slice(-8).forEach(function(c){ul.append(h('li',{text:c}));});
  showMsg([h('div',{class:'ai-busy',text:a.model+' is working on it...'}),aiChanges.length?ul:null].filter(Boolean),
    {choices:[{label:'Stop',fn:function(){ if(aiAbort) aiAbort.abort(); }}]});
}
async function aiAsk(text){
  text=String(text||'').trim(); if(!text) return;
  if(aiBusy) return showMsg('The assistant is still working on the last instruction.',{choices:[{label:'Stop it',fn:function(){if(aiAbort) aiAbort.abort();}}]});
  const c=aiCfg(), a=aiActive(c), miss=aiMissing(a);
  if(miss) return aiSettings('To use the assistant, add '+miss+'.',text);
  const ad=ADAPTERS[a.p.kind];
  const sig=a.p.id+'|'+a.model+'|'+a.base;
  if(!aiConv||aiConv.sig!==sig) aiConv={sig:sig,msgs:[],turns:0};
  const startLen=aiConv.msgs.length;
  ad.pushUser(aiConv, aiConv.turns===0
    ? aiToday()+'\n\n<roadmap_overview>\n'+aiOverview()+'\n</roadmap_overview>\n\nInstruction: '+text
    : aiToday()+'\n\nInstruction: '+text);
  aiBusy=true; aiAbort=new AbortController(); aiChanges=[]; aiPushed=false;
  aiProgress(a);
  let reply='', note='', model=a.model, failed=null;
  try{
    let i=0;
    for(;i<AI_MAX_ROUNDS;i++){
      const r=await ad.step(a,aiConv,aiAbort.signal);
      model=r.model||model; if(r.text) reply=r.text;
      if(r.stop==='tool'){ ad.pushResults(aiConv,r.calls.map(aiExec)); aiProgress(a); continue; }
      if(r.stop==='pause') continue;
      if(r.stop==='refusal') note='The model declined this request.';
      else if(r.stop==='max') note='The answer was cut off because it got too long.';
      break;
    }
    if(i>=AI_MAX_ROUNDS) note='Stopped after '+AI_MAX_ROUNDS+' rounds of tool calls. Check the result and ask again for the rest.';
    aiConv.turns++;
  }catch(e){
    failed=e instanceof AiError?e:new AiError('other',(e&&e.message)||String(e));
    aiConv.msgs.length=startLen;   // forget the unfinished turn so the next one starts clean
  }finally{
    aiBusy=false; aiAbort=null;
  }
  const lines=[];
  if(failed){ lines.push(h('div',{text:failed.message})); }
  if(!failed&&reply) lines.push(h('div',{class:'ai-text',text:reply}));
  if(!failed&&!reply&&!aiChanges.length) lines.push(h('div',{text:'The model finished without saying anything.'}));
  if(aiChanges.length){
    const ul=h('ul',{class:'ai-log'}); aiChanges.forEach(function(x){ul.append(h('li',{text:x}));});
    lines.push(h('div',{class:'ai-meta',text:failed?'Changes made before it stopped:':'Changes:'}),ul);
  }
  if(note) lines.push(h('div',{class:'ai-meta',text:note}));
  lines.push(h('div',{class:'ai-meta',text:aiProv(c.provider).name+' · '+model+(aiConv.turns?' · follow-ups keep the conversation (type "new chat" to start over)':'')}));
  const choices=[];
  if(failed&&(failed.kind==='auth'||failed.kind==='model')) choices.push({label:'AI settings',fn:function(){aiSettings();}});
  choices.push({label:'New chat',fn:function(){aiConv=null; showMsg('Started a new conversation with the assistant.');}});
  showMsg(lines,{err:!!failed&&failed.kind!=='abort',undo:aiChanges.length>0,choices:choices});
}

/* =====================================================================
   SYNC THROUGH A GITHUB GIST
   Progress, notes, ticks, calendar and step edits are saved to one file
   (roadmap-sync.json) in a secret gist on the user's GitHub account, so every
   device and browser that connects with a token sees the same roadmap and no
   download is needed. The token stays in this browser's localStorage.
   Flow: each change marks this copy "dirty" and saves after SYNC_DELAY. Every
   sync first reads the gist: if it changed elsewhere and this copy has no
   unsaved changes, the gist copy is loaded; if both changed, the user picks.
   ===================================================================== */
const SYNC_KEY='roadmap-sync-v1', SYNC_FILE='roadmap-sync.json', SYNC_DELAY=2500;
const SYNC_TOKEN_URL='https://github.com/settings/tokens/new?scopes=gist&description=Roadmap%20sync';
let syncTimer=null, syncBusy=null, syncAgain=false, syncApplying=false, syncEdits=0, syncConflict=null, syncLastPull=0;
let syncState={s:'off',msg:''};

function syncCfg(){
  let c=null; try{c=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');}catch(e){}
  c=c||{}; if(!c.device){ c.device='d'+Math.random().toString(36).slice(2,10); syncSaveCfg(c); }
  return c;
}
function syncSaveCfg(c){try{localStorage.setItem(SYNC_KEY,JSON.stringify(c));}catch(e){}}
function syncOn(){return !!syncCfg().token;}
function syncSet(s,msg){ syncState={s:s,msg:msg||''}; syncRenderButton(); }
function syncRenderButton(){
  const b=$('#syncBtn'); if(!b) return;
  const on=syncOn(); b.hidden=!on; if(!on) return;
  const c=syncCfg();
  const label={off:'Not synced yet',saving:'Saving to GitHub...',synced:'Synced'+(c.syncedAt?' '+syncAgo(c.syncedAt):''),offline:'Offline: changes will sync when you are back online',error:'Sync problem: '+syncState.msg,conflict:'Changed on two devices: choose which copy to keep',waiting:'Changes waiting to sync'}[syncState.s]||'Sync';
  b.setAttribute('data-state',syncState.s); b.title=label; b.setAttribute('aria-label','Sync: '+label+'. Open sync settings.');
}
function syncAgo(isoT){
  const m=Math.round((Date.now()-Date.parse(isoT))/60000);
  return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':fmtShort(isoT.slice(0,10));
}
// Called from save() and saveCustom(): this copy now has changes the gist does not.
function syncDirty(){
  if(syncApplying||!syncOn()) return;
  syncEdits++;
  const c=syncCfg(); if(!c.dirty){c.dirty=true; syncSaveCfg(c);}
  if(syncState.s!=='conflict') syncSet('waiting');
  clearTimeout(syncTimer); syncTimer=setTimeout(function(){syncNow();},SYNC_DELAY);
}
function syncPayload(c){
  return {app:'roadmap-sync',version:1,savedAt:new Date().toISOString(),device:c.device,
    state:{status:state.status,notes:state.notes,checks:state.checks,doneAt:state.doneAt,sched:state.sched},
    roadmap:custom?DATA:null, roadmapBase:custom?custom.baseHash:null};
}
function SyncError(kind,msg){this.kind=kind;this.message=msg;}
async function gh(c,method,path,body){
  let res;
  try{
    res=await fetch((c.api||'https://api.github.com')+path,{method:method,cache:'no-store',
      headers:Object.assign({Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),
      body:body?JSON.stringify(body):undefined});
  }catch(e){ throw new SyncError('offline','Could not reach GitHub.'); }
  let j=null; try{ j=await res.json(); }catch(e){}
  if(res.status===401) throw new SyncError('auth','GitHub did not accept the token. It may have expired or been deleted.');
  if(res.status===403||res.status===429) throw new SyncError('error',(j&&j.message)||'GitHub refused the request (rate limit or missing "gist" permission).');
  if(res.status===404) throw new SyncError('missing','Not found.');
  if(!res.ok) throw new SyncError('error','GitHub error '+res.status+((j&&j.message)?': '+j.message:''));
  return j;
}
async function gistRead(c){
  const g=await gh(c,'GET','/gists/'+encodeURIComponent(c.gist));
  const f=g.files&&g.files[SYNC_FILE]; if(!f) return null;
  let text=f.content;
  if(f.truncated&&f.raw_url){ try{ text=await (await fetch(f.raw_url,{cache:'no-store'})).text(); }catch(e){ throw new SyncError('offline','Could not download the synced copy.'); } }
  try{ return JSON.parse(text); }catch(e){ throw new SyncError('error','The synced copy on GitHub is damaged.'); }
}
function localHasData(){
  return !!custom||['status','notes','checks','sched'].some(function(k){return Object.keys(state[k]||{}).length>0;});
}
// Finds the gist made by an earlier connection (from any device), or makes a new secret one.
async function gistFindOrCreate(c){
  for(let page=1;page<=5;page++){
    const list=await gh(c,'GET','/gists?per_page=100&page='+page);
    const g=(list||[]).find(function(x){return x.files&&x.files[SYNC_FILE];});
    if(g){ c.gist=g.id; c.dirty=localHasData(); syncSaveCfg(c); return 'found'; }
    if(!list||list.length<100) break;
  }
  const p=syncPayload(c);
  const g=await gh(c,'POST','/gists',{description:'Roadmap sync data (made by roadmap.html). Do not rename the file.',public:false,files:{[SYNC_FILE]:{content:JSON.stringify(p)}}});
  c.gist=g.id; c.lastSeen=p.savedAt; c.dirty=false; c.syncedAt=p.savedAt; syncSaveCfg(c);
  return 'created';
}
function syncApply(remote){
  const p=cleanProgress(remote.state||{}); if(remote.roadmap) checkRoadmap(remote.roadmap);   // throws before any change
  syncApplying=true;
  try{
    pushHistory();
    state=p; save();
    if(remote.roadmap){
      custom={baseHash:remote.roadmapBase||BASE_HASH,data:remote.roadmap,savedAt:remote.savedAt};
      staleCustom=custom.baseHash!==BASE_HASH;
      try{localStorage.setItem(CUSTOM_KEY,JSON.stringify(custom));}catch(e){}
      useData(clone(remote.roadmap));
    }else if(custom){
      try{localStorage.removeItem(CUSTOM_KEY);}catch(e){}
      custom=null; staleCustom=false; useData(clone(ROADMAP));
    }
    renderAll();
  }finally{ syncApplying=false; }
}
async function syncPush(c){
  const edits=syncEdits, p=syncPayload(c);
  syncSet('saving');
  await gh(c,'PATCH','/gists/'+encodeURIComponent(c.gist),{files:{[SYNC_FILE]:{content:JSON.stringify(p)}}});
  c.lastSeen=p.savedAt; c.syncedAt=p.savedAt; if(edits===syncEdits) c.dirty=false; syncSaveCfg(c);
}
async function syncOnce(){
  const c=syncCfg(); if(!c.token) return syncSet('off');
  clearTimeout(syncTimer); syncLastPull=Date.now();
  let made=null;
  if(!c.gist) made=await gistFindOrCreate(c);
  if(made==='created'){ syncSet('synced'); return 'created'; }
  let remote;
  try{ remote=await gistRead(c); }
  catch(e){ if(e.kind==='missing'){ delete c.gist; syncSaveCfg(c); throw new SyncError('error','The sync gist was deleted on GitHub. Connect again to make a new one.'); } throw e; }
  const changedThere=!!remote&&remote.savedAt!==c.lastSeen;
  if(changedThere&&!c.dirty){
    syncApply(remote); c.lastSeen=remote.savedAt; c.syncedAt=new Date().toISOString(); syncSaveCfg(c);
    syncSet('synced'); return made==='found'?'loaded':'pulled';
  }
  if(changedThere&&c.dirty){
    syncConflict={remote:remote}; syncSet('conflict'); renderBanner(); return 'conflict';
  }
  if(c.dirty||!remote){ await syncPush(c); syncSet(syncCfg().dirty?'waiting':'synced'); return 'pushed'; }
  c.syncedAt=new Date().toISOString(); syncSaveCfg(c); syncSet('synced'); return 'same';
}
// Runs one sync; if called while one is running, runs once more afterwards.
function syncNow(){
  if(!syncOn()){ syncSet('off'); return Promise.resolve('off'); }
  if(syncBusy){ syncAgain=true; return syncBusy; }
  syncBusy=(async function(){
    let r;
    do{
      syncAgain=false;
      try{ r=await syncOnce(); }
      catch(e){
        r='error';
        if(e instanceof SyncError){ syncSet(e.kind==='offline'?'offline':'error',e.message); if(e.kind==='auth') toast('Sync stopped: '+e.message); }
        else{ syncSet('error',(e&&e.message)||String(e)); }
      }
    }while(syncAgain);
    return r;
  })().finally(function(){ syncBusy=null; });
  return syncBusy;
}
function syncResolve(useRemote){
  const k=syncConflict; if(!k) return;
  syncConflict=null;
  const c=syncCfg();
  if(useRemote){
    try{ syncApply(k.remote); }catch(e){ syncSet('error',e.message); renderBanner(); return; }
    c.dirty=false; c.lastSeen=k.remote.savedAt; c.syncedAt=new Date().toISOString(); syncSaveCfg(c);
    syncSet('synced'); renderBanner(); toast('Loaded the copy from your other device. Type "undo" to go back.');
  }else{
    c.lastSeen=k.remote.savedAt; c.dirty=true; syncSaveCfg(c);   // treat the other copy as seen, then save ours over it
    renderBanner(); syncNow();
  }
}
function syncConflictBanner(){
  const r=syncConflict.remote;
  return h('div',{class:'banner'},
    h('span',{text:'Your roadmap changed on another device'+(r.savedAt?' ('+syncAgo(r.savedAt)+')':'')+' and in this browser since the last sync. Which copy should be kept?'}),
    h('span',{class:'hstack wrap'},
      h('button',{class:'btn small',type:'button',onclick:function(){syncResolve(true);},text:'Use the other device\'s copy'}),
      h('button',{class:'btn small primary',type:'button',onclick:function(){syncResolve(false);},text:'Keep this device\'s copy'})));
}
function syncSettings(note){
  const c=syncCfg();
  const iTok=h('input',{type:'password',autocomplete:'off',spellcheck:'false',placeholder:c.token?'(saved; paste a new one to replace it)':'ghp_...'});
  const form=h('div',{class:'ai-form',role:'group','aria-label':'Sync settings'},h('label',{class:'ai-wide'},'GitHub token with only the "gist" permission',iTok));
  const lines=[h('strong',{text:'Sync across devices'}), note?h('div',{text:note}):null];
  if(c.token){
    const bad=syncState.s==='error'||syncState.s==='offline'||syncState.s==='conflict';
    lines.push(h('div',{class:bad?'ai-meta':'',text:(bad?'':'Connected'+(c.gist?', saving to secret gist '+c.gist:'')+'. ')+($('#syncBtn').title||'').replace(/\.*$/,'.')}));
    if(c.gist&&!c.api) lines.push(h('div',{class:'ai-meta'},'View it on GitHub: ',h('a',{href:'https://gist.github.com/'+c.gist,target:'_blank',rel:'noopener noreferrer',text:'gist.github.com/'+c.gist})));
  }else{
    lines.push(h('div',{class:'ai-meta'},'1. ',h('a',{href:SYNC_TOKEN_URL,target:'_blank',rel:'noopener noreferrer',text:'Create a GitHub token'}),
      ' (classic, only the "gist" box ticked; pick an expiry you are happy with). 2. Paste it here and press Connect. 3. Do the same on your other devices with the same token or another one from the same account.'));
  }
  lines.push(form, h('div',{class:'ai-meta',text:'The token is kept only in this browser. Your progress, notes, calendar and step edits are saved in a secret gist: it is not listed anywhere, but anyone who has its link can read it, so do not put passwords in your notes.'}));
  function connect(){
    const t=iTok.value.trim();
    if(!t&&!c.token) return syncSettings('Paste a token first.');
    if(t&&t!==c.token){ c.token=t; delete c.gist; delete c.lastSeen; c.dirty=false; syncSaveCfg(c); }
    showMsg([h('div',{class:'ai-busy',text:'Connecting to GitHub...'})]);
    syncNow().then(function(r){
      renderBanner();
      const msg={created:'Connected. A new secret gist now holds your roadmap; changes save automatically.',loaded:'Connected. Loaded your roadmap from the gist you made on another device.',
        conflict:'Connected. This browser and the gist both have progress: choose which to keep in the banner on the page.',pushed:'Connected and saved.',same:'Connected. Everything is up to date.',pulled:'Connected and updated from GitHub.'}[r];
      if(msg) showMsg(msg); else syncSettings(syncState.msg||'Could not connect.');
    });
  }
  const choices=[];
  if(c.token){
    choices.push({label:'Sync now',fn:function(){ syncNow().then(function(){ syncSettings(); }); }});
    choices.push({label:'Disconnect',fn:function(){ if(!confirm('Stop syncing in this browser? Your data stays here and in the gist.')) return; const d=syncCfg(); delete d.token; delete d.gist; delete d.lastSeen; delete d.dirty; syncSaveCfg(d); syncConflict=null; syncSet('off'); renderBanner(); showMsg('Sync is off in this browser.'); }});
  }
  showMsg(lines.filter(Boolean),{apply:connect,applyText:c.token?'Save token':'Connect',choices:choices});
  form.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();connect();} });
  setTimeout(function(){iTok.focus();},30);
}
function syncInit(){
  syncRenderButton();
  if(!syncOn()) return;
  syncSet(syncCfg().dirty?'waiting':'saving');
  syncNow();
  // pick up changes from other devices when coming back to the page; save before leaving
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'){ if(syncCfg().dirty) syncNow(); }
    else if(Date.now()-syncLastPull>15000) syncNow();
  });
  window.addEventListener('online',function(){ syncNow(); });
  setInterval(function(){ if(document.visibilityState==='visible'&&(syncCfg().dirty||Date.now()-syncLastPull>110000)) syncNow(); },120000);
  setInterval(syncRenderButton,60000);
}

/* ---------- init ---------- */
function init(){
  initTheme(); load(); loadCustom();
  useData(custom?clone(custom.data):clone(ROADMAP));
  let saved=null; try{saved=localStorage.getItem(TAB_KEY);}catch(e){}
  currentTab=(saved==='week'||saved==='all'||saved==='cal'||TRACKS.some(function(t){return t.id===saved;}))?saved:'week';
  if(viewOpts.calMode) calMode=viewOpts.calMode;
  renderLegend(); renderAll();
  $('#themeBtn').addEventListener('click',toggleTheme);
  $('#scrim').addEventListener('click',closePanel);
  $('#panel').addEventListener('keydown',trapPanelTab);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(openId||panelMode!=='view')) closePanel();});
  $('#exportBtn').addEventListener('click',exportProgress);
  $('#importBtn').addEventListener('click',function(){$('#importFile').click();});
  $('#importFile').addEventListener('change',function(e){const f=e.target.files[0]; if(f) importProgress(f); e.target.value='';});
  $('#resetBtn').addEventListener('click',resetProgress);
  $('#downloadBtn').addEventListener('click',downloadRoadmap);
  $('#helpBtn').addEventListener('click',function(){ if(out().querySelector('.help-grid')) out().replaceChildren(); else helpBox(); });
  $('#progChip').addEventListener('click',function(){setTab('all');});
  $('#aiBtn').addEventListener('click',function(){aiToggle();});
  $('#aiSetBtn').addEventListener('click',function(){ window.scrollTo(0,0); aiSettings(); });
  aiSyncButton();
  startClock();   // reminders fire on every tab, not only after opening the Calendar
  $('#syncBtn').addEventListener('click',function(){ syncSettings(); });
  $('#syncSetBtn').addEventListener('click',function(){ window.scrollTo(0,0); syncSettings(); });
  syncInit();
  $('#tabs').addEventListener('scroll',fadeTabs,{passive:true});
  $('#tabs').addEventListener('keydown',tabKeys);
  window.addEventListener('resize',fadeTabs);
  document.addEventListener('keydown',function(e){
    const t=e.target, typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
    if(e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey){e.preventDefault();$('#cmdInput').focus();}
    else if(e.key==='?'&&!typing){e.preventDefault();helpBox();}
    else if(e.key==='Escape'&&out().firstChild&&!(openId||panelMode!=='view')){out().replaceChildren(); if(t===$('#cmdInput')) t.blur();}
  });
  document.addEventListener('pointerdown',function(e){
    if(out().firstChild&&!$('#cmd').contains(e.target)&&!$('#helpBtn').contains(e.target)&&!$('#aiSetBtn').contains(e.target)&&!$('#syncSetBtn').contains(e.target)&&!$('#syncBtn').contains(e.target)&&!e.target.closest('#panel')) out().replaceChildren();
  });
  let compact=false;
  window.addEventListener('scroll',function(){
    const y=window.scrollY;
    if(!compact&&y>90){compact=true;$('#top').classList.add('compact');}
    else if(compact&&y<20){compact=false;$('#top').classList.remove('compact');}
  },{passive:true});
  $('#cmdForm').addEventListener('submit',function(e){
    e.preventDefault(); const v=$('#cmdInput').value;
    lastRaw=v;
    try{ if(!aiRoute(v)) runCommand(v); }catch(err){showMsg('Something went wrong: '+err.message,{err:true});}
    $('#cmdInput').value='';
  });
  window.__roadmap={run:runCommand,sched:function(){return state.sched;},occ:occurrences,parseSched:parseSchedule,parseDate:parseDateText,data:function(){return DATA;},state:function(){return state;},status:getStatus,
    reminders:function(){return !!clockTimer;}, syncNow:syncNow};
}
init();
})();
</script>
