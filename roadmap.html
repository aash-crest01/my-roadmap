<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data and AI Roadmap</title>
<style>
:root{
  --bg:#f6f6f3; --surface:#ffffff; --surface2:#f0f0ec; --text:#1b1b1f; --muted:#62626b;
  --border:#dddde3; --line:#c4c4cd; --accent:#4f46e5; --accent-text:#ffffff;
  --s-todo:#9ca3af; --s-doing:#e69500; --s-done:#16a34a; --s-skipped:#8b5cf6;
  --shadow:0 8px 30px rgba(0,0,0,.18);
}
:root[data-theme="dark"]{
  --bg:#111114; --surface:#1b1b20; --surface2:#25252c; --text:#ececf1; --muted:#9c9ca8;
  --border:#2f2f38; --line:#44444f; --accent:#8b86ff; --accent-text:#111114;
  --s-todo:#7c8290; --s-doing:#f5b034; --s-done:#3ccf6e; --s-skipped:#a98bff;
  --shadow:0 8px 30px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:.85rem}
button{font:inherit;color:inherit}
h1{font-size:1.35rem;margin:0}
h2{font-size:1.15rem;margin:0}
.top{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;padding-top:12px}
.top-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.top-row p{margin:2px 0 0}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.icon{padding:4px 10px}
.overall{margin:10px 0 6px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.bar>span{display:block;height:100%;width:0;background:var(--s-done);transition:width .3s}
.overall .small{margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--tc,var(--accent))}
.tab .pct{font-size:.75rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.tab[aria-selected="true"] .pct{color:var(--accent-text);opacity:.85}
.warn{background:#fff4d6;color:#5a4300;border:1px solid #e6c766;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:.9rem}
:root[data-theme="dark"] .warn{background:#3a2f10;color:#f3e2b0;border-color:#6b5a22}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 4px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--c)}
.track-head{margin:10px 0 18px}
.track-head p{margin:4px 0 10px}
.track-head .bar>span{background:var(--tc,var(--accent))}

/* path */
.path{position:relative;padding:10px 0 30px}
.path::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-1px)}
.row{display:grid;grid-template-columns:1fr minmax(0,360px) 1fr;align-items:center;margin:0 0 26px;position:relative}
.main{grid-column:2;position:relative;z-index:1}
.branches{grid-column:3;display:flex;flex-direction:column;gap:10px;padding-left:38px;position:relative;z-index:1}
.branches .node{position:relative}
.branches .node::before{content:"";position:absolute;left:-38px;top:50%;width:38px;border-top:2px dashed var(--line)}
.node{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:6px solid var(--sc,var(--s-todo));border-radius:10px;padding:10px 12px;cursor:pointer}
.node:hover{border-color:var(--accent);border-left-color:var(--sc)}
.node:focus-visible,.card:focus-visible,.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.node.branch{border-style:dashed;border-left-style:solid;padding:8px 10px;font-size:.9rem}
.node[data-status="todo"]{--sc:var(--s-todo)}
.node[data-status="doing"]{--sc:var(--s-doing)}
.node[data-status="done"]{--sc:var(--s-done)}
.node[data-status="skipped"]{--sc:var(--s-skipped)}
.node[data-status="done"] .n-title{opacity:.75}
.node[data-status="skipped"] .n-title{text-decoration:line-through;opacity:.6}
.n-title{display:block;font-weight:600;line-height:1.3}
.n-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:.78rem;color:var(--muted);align-items:center}
.tag{border-radius:99px;padding:1px 8px;font-size:.72rem;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.tag.st{border-color:var(--sc);color:var(--sc);background:transparent;font-weight:600}
.tag.verify{background:#fff1cc;border-color:#e0b64a;color:#6b4b00}
:root[data-theme="dark"] .tag.verify{background:#3a2f10;border-color:#7a6528;color:#f3d98b}
.tag.dep{border-style:dashed}

/* week view */
.sec-title{margin:22px 0 8px;font-size:1rem;display:flex;align-items:center;gap:8px}
.sec-title .count{font-size:.78rem;color:var(--muted);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{text-align:left;background:var(--surface);border:1px solid var(--border);border-left:6px solid var(--sc,var(--s-todo));border-radius:10px;padding:10px 12px;cursor:pointer;display:block;width:100%}
.card:hover{border-color:var(--accent);border-left-color:var(--sc)}
.card[data-status="todo"]{--sc:var(--s-todo)} .card[data-status="doing"]{--sc:var(--s-doing)}
.card .c-track{font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.card .c-track i{width:8px;height:8px;border-radius:50%;background:var(--tc);display:inline-block}
.card .c-title{font-weight:600;margin:2px 0 4px;display:block}
.card .c-when{font-size:.8rem;color:var(--muted)}
.card .c-when.late{color:#d14343;font-weight:600}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}

/* panel */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.show{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .25s;z-index:50;overflow-y:auto;padding:18px 18px 40px}
#panel.open{transform:none}
.p-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.p-head h2{margin-top:6px;font-size:1.2rem;line-height:1.3}
.track-tag{display:inline-block;font-size:.75rem;border-radius:99px;padding:2px 10px;border:1px solid var(--tc);color:var(--tc)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0 14px}
.seg button{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:8px;cursor:pointer;font-size:.88rem;display:flex;gap:8px;align-items:center;justify-content:center}
.seg button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.seg button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);font-weight:600}
.p-date{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px;font-size:.92rem}
.p-note-verify{font-size:.82rem;color:var(--muted);margin:2px 0 8px}
.p-sec{margin-top:16px}
.p-sec h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.p-sec p{margin:0}
.p-sec ul{margin:0;padding-left:20px}
.p-sec li{margin:3px 0}
.p-sec a{color:var(--accent);word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);border-left:5px solid var(--sc,var(--s-todo));background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:.84rem;cursor:pointer;text-align:left}
.chip[data-status="doing"]{--sc:var(--s-doing)} .chip[data-status="done"]{--sc:var(--s-done)} .chip[data-status="skipped"]{--sc:var(--s-skipped)}
textarea{width:100%;min-height:90px;resize:vertical;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font:inherit;font-size:.92rem}

.foot{padding:20px 16px 60px;border-top:1px solid var(--border);margin-top:30px}
.foot .actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;opacity:0;transition:all .25s;z-index:80;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .top{position:static}
  .path::before{left:16px}
  .row{grid-template-columns:1fr;padding-left:38px;margin-bottom:22px;align-items:stretch}
  .main,.branches{grid-column:1}
  .main::before{content:"";position:absolute;left:-30px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--ms,var(--s-todo));border:2px solid var(--bg)}
  .main[data-status="doing"]{--ms:var(--s-doing)} .main[data-status="done"]{--ms:var(--s-done)} .main[data-status="skipped"]{--ms:var(--s-skipped)}
  .branches{padding-left:22px;margin-top:10px}
  .branches .node::before{left:-22px;width:22px}
  #panel{padding:16px 14px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hstack{display:flex;gap:6px}
.hstack.wrap{flex-wrap:wrap}
.hstack.center{align-items:center}
.tag.late{color:#d14343;border-color:#d14343}
.tag.s-todo,.node[data-status="todo"] .tag.st{color:var(--muted)}
.cw,.nw{position:relative}
.cw .card{padding-right:46px;height:100%}
.nw .node{padding-right:44px}
.qtick{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.qtick svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.qtick:hover{border-color:var(--s-done);color:var(--s-done)}
.qtick.on{background:var(--s-done);border-color:var(--s-done);color:#fff}
.qtick.cl{color:var(--muted);border-style:dashed}
.qtick.cl:hover{color:var(--accent);border-color:var(--accent)}
.qtick:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nw .node.branch + .qtick{top:7px;width:24px;height:24px}
.main.is-next .node{box-shadow:0 0 0 2px var(--accent)}
.path-today{position:relative;z-index:1;margin:-8px 0 18px}
.path-today span{background:var(--bg);padding:0 8px}
.blurb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blurb.open{display:block}
.linkbtn{background:none;border:0;padding:0;margin:-6px 0 10px;color:var(--accent);font-size:.85rem;cursor:pointer}
.linkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.goal[hidden]{display:none}
#toast.act{pointer-events:auto;display:flex;gap:14px;align-items:center}
.toast-btn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.day-picks{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.day-picks .fchip{cursor:pointer}

/* ---------- v2 additions ---------- */
.top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#themeBtn{white-space:nowrap}
.cmd{margin:10px 0 4px}
.cmd form{display:flex;gap:6px}
.cmd input{flex:1;min-width:0;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font:inherit;font-size:.95rem}
.cmd input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{border-color:#d14343;color:#d14343}
.btn.small{padding:3px 9px;font-size:.8rem}
#cmdOut{margin:6px 0 4px;font-size:.9rem}
#cmdOut:empty{display:none}
.cmd-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.cmd-box.err{border-color:#d14343}
.cmd-box ul{margin:4px 0 8px;padding-left:20px}
.cmd-box .row-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cmd-box code{background:var(--surface2);border-radius:4px;padding:1px 5px;font-size:.85em}
.help-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px;margin:6px 0}
.help-grid div{font-size:.86rem}
.banner{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

/* mini progress on nodes */
.mini{display:inline-flex;align-items:center;gap:5px}
.mini b{display:inline-block;width:44px;height:5px;border-radius:9px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.mini b i{display:block;height:100%;background:var(--s-done)}

/* checklist */
.cl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cl-group{font-size:.8rem;font-weight:600;color:var(--muted);margin:12px 0 4px}
.cl-item{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--border)}
.cl-item input{margin-top:4px;width:17px;height:17px;accent-color:var(--s-done);flex:0 0 auto}
.cl-item label{flex:1;cursor:pointer;line-height:1.35;font-size:.92rem}
.cl-item.done label{color:var(--muted);text-decoration:line-through}
.cl-links{display:flex;gap:8px;font-size:.78rem;flex:0 0 auto;padding-top:2px}
.cl-links a{color:var(--accent);text-decoration:none}
.cl-links a:hover{text-decoration:underline}

/* whole roadmap */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0 14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.tile .v{font-size:1.35rem;font-weight:700;line-height:1.2}
.tile .k{font-size:.78rem;color:var(--muted)}
.tile.late .v{color:#d14343}
.trow{display:grid;grid-template-columns:minmax(110px,190px) 1fr 160px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:.88rem;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.trow:hover .tn{color:var(--accent)}
.trow .tn{display:flex;gap:8px;align-items:center;font-weight:600}
.trow .tn i{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:0 0 auto}
.trow .bar>span{background:var(--tc)}
.trow .tv{color:var(--muted);font-size:.8rem;text-align:right;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px}
.fchip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:.82rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip i{width:8px;height:8px;border-radius:50%;background:var(--tc,var(--muted))}
.fchip[aria-pressed="false"]{opacity:.45}
.fchip[aria-pressed="false"] i{background:transparent;border:1px solid var(--muted)}
.phase{margin:26px 0 6px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--border)}
.phase h3{margin:0;font-size:1rem}
.phase p{margin:3px 0 0;font-size:.85rem;color:var(--muted)}
.phase .bar{margin-top:8px}
.month{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:600}
.tl{display:flex;flex-direction:column;gap:6px}
.tl-item{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:6px solid var(--tc);border-radius:9px;padding:8px 10px;cursor:pointer;width:100%}
.tl-item:hover{border-color:var(--accent);border-left-color:var(--tc)}
.tl-item.branch{margin-left:22px;width:calc(100% - 22px);border-style:dashed;border-left-style:solid;padding:6px 10px;font-size:.9rem}
.tl-item .d{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-item .t{font-weight:600;line-height:1.3;display:block}
.tl-item .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:.76rem;color:var(--muted)}
.tl-item[data-status="done"] .t{opacity:.65}
.tl-item[data-status="skipped"] .t{text-decoration:line-through;opacity:.55}
.tag.s-todo{--sc:var(--s-todo)} .tag.s-doing{--sc:var(--s-doing)} .tag.s-done{--sc:var(--s-done)} .tag.s-skipped{--sc:var(--s-skipped)}
.today{display:flex;align-items:center;gap:8px;color:#d14343;font-size:.78rem;font-weight:700;margin:8px 0}
.today::before,.today::after{content:"";flex:1;border-top:2px solid #d14343}

/* edit form */
.form label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 3px;font-weight:600}
.form input[type=text],.form input[type=date],.form select,.form textarea{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font:inherit;font-size:.92rem}
.form textarea{min-height:70px}
.form .inline{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .hint{font-size:.76rem;color:var(--muted);margin-top:2px}
.form .row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.track-head .head-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
@media (max-width:760px){
  .trow{grid-template-columns:1fr auto}
  .trow .bar{grid-column:1 / -1;order:3}
  .form .two{grid-template-columns:1fr}
}

/* ---------- calendar ---------- */
.cal-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:10px}
.cal-top>.hstack{justify-content:flex-end}
.clock{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.clock small{display:inline;margin-left:8px;font-size:.85rem;font-weight:400;color:var(--muted)}
.nownext{font-size:.9rem;margin-top:4px}
.nownext b{color:var(--accent)}
.cal-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.cal-bar .lbl{font-weight:600;margin:0 6px;min-width:140px}
.segm{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.segm button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:.85rem}
.segm button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
.cal-stats{font-size:.85rem;color:var(--muted);margin:2px 0 8px}
.wk{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}
.wk-head,.wk-all{display:grid;grid-template-columns:48px repeat(var(--days),minmax(0,1fr));border-bottom:1px solid var(--border)}
.wk-head div{padding:6px 4px;text-align:center;font-size:.8rem;color:var(--muted);cursor:pointer}
.wk-head div b{display:block;font-size:1.05rem;color:var(--text)}
.wk-head div.is-today b{background:#d14343;color:#fff;border-radius:99px;display:inline-block;min-width:28px;padding:0 6px}
.wk-all > div{padding:3px;min-height:26px;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.wk-all > div:first-child{border-left:0;font-size:.68rem;color:var(--muted);align-items:center;justify-content:center}
.due{font-size:.72rem;border-radius:5px;padding:1px 5px;background:color-mix(in srgb,var(--tc) 18%,var(--surface));border-left:3px solid var(--tc);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;border-top:0;border-right:0;border-bottom:0;color:var(--text);width:100%}
.due.fin{opacity:.5;text-decoration:line-through}
.wk-scroll{max-height:min(68vh,760px);overflow-y:auto;position:relative;padding-top:10px}

.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.mo .dn{font-size:.75rem;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--border)}

.mo .cell.out{opacity:.45}
.mo .cell .num{font-size:.8rem;font-weight:600}
.mo .cell.is-today .num{background:#d14343;color:#fff;border-radius:99px;padding:0 6px;align-self:flex-start}

.unsched{margin-top:18px}

.today-list{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
.tdl{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:6px solid var(--tc);border-radius:9px;padding:7px 10px;cursor:pointer;width:100%;font-size:.9rem}
.tdl .tm{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.82rem}

/* ---------- v3 compact header ---------- */
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-text);padding:8px 12px;border-radius:0 0 8px 0;z-index:100}

.top{position:sticky;top:0;z-index:30;padding:0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.bar1{display:flex;align-items:center;gap:10px;padding:8px 0 6px}
.bar1 h1{font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;letter-spacing:-.01em}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:3px 10px 3px 4px;cursor:pointer;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto;color:var(--text)}
.pchip:hover{border-color:var(--accent)}
.pchip svg{width:22px;height:22px;transform:rotate(-90deg)}
.pchip circle{fill:none;stroke-width:4}
.ring-bg{stroke:var(--surface2)}
.ring-fg{stroke:var(--s-done);stroke-dasharray:94.25;stroke-dashoffset:94.25;stroke-linecap:round;transition:stroke-dashoffset .4s}
.cmd{position:relative;flex:1;min-width:0;margin:0}
.cmd form{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 4px 0 10px;height:38px;transition:border-color .15s,box-shadow .15s}
.cmd form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.cmd-ico{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cmd input{flex:1;min-width:0;border:0!important;background:transparent!important;box-shadow:none!important;padding:0 8px!important;height:100%;font-size:.93rem;color:var(--text);outline:none}
.kbd{font:600 .72rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:3px 6px;margin-right:4px}
.cmd form:focus-within .kbd{display:none}
.cmd-go{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-text);cursor:pointer;flex:0 0 auto}
.cmd-go svg,.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn svg .fill{fill:currentColor;stroke:none}
.ibtn{display:grid;place-items:center;width:38px;height:38px;flex:0 0 auto;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.ibtn:hover{color:var(--text);border-color:var(--accent)}
#syncBtn{position:relative}
#syncBtn[hidden]{display:none}
#syncBtn .sdot{position:absolute;right:6px;bottom:7px;width:8px;height:8px;border-radius:50%;background:var(--s-done);border:1.5px solid var(--surface)}
#syncBtn[data-state="saving"] .sdot,#syncBtn[data-state="waiting"] .sdot{background:var(--s-doing)}
#syncBtn[data-state="error"] .sdot,#syncBtn[data-state="conflict"] .sdot,#syncBtn[data-state="offline"] .sdot{background:#d14343}
.ai-tog{flex:0 0 auto;height:26px;margin-right:6px;padding:0 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.04em;cursor:pointer}
.ai-tog[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}
.ai-tog:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ai-text{white-space:pre-wrap;margin-bottom:4px}
.ai-log{margin:6px 0 4px;padding-left:18px;color:var(--muted);font-size:.84rem}
.ai-meta{font-size:.76rem;color:var(--muted);margin-top:4px}
.ai-busy{display:flex;align-items:center;gap:8px}
.ai-busy::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:aispin .8s linear infinite}
@keyframes aispin{to{transform:rotate(360deg)}}
.ai-form{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0 2px}
.ai-form label{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.ai-form label[hidden]{display:none}
.cmd .ai-form input,.cmd .ai-form select{display:block;width:100%;height:36px!important;flex:none;background:var(--surface2)!important;color:var(--text);border:1px solid var(--border)!important;border-radius:8px;padding:0 10px!important;font:inherit;font-size:.9rem}
.cmd .ai-form input:focus,.cmd .ai-form select:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)!important}
@media (min-width:640px){.ai-form{grid-template-columns:1fr 1fr}.ai-form .ai-wide{grid-column:1/-1}}
.cmd-go:focus-visible,.ibtn:focus-visible,.pchip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* instruction results float over the page instead of pushing it down */
#cmdOut{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:35;margin:0;max-height:min(62vh,560px);overflow:auto;border-radius:12px;box-shadow:var(--shadow)}
#cmdOut .cmd-box{border-radius:12px;padding:12px 14px}
.hbar{height:3px;background:transparent}
.hbar>span{display:block;height:100%;width:0;background:var(--s-done);transition:width .4s}
/* tabs */
.tabs{gap:4px;padding:0 0 8px;scrollbar-width:none;align-items:center;-webkit-mask-image:none;mask-image:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.fr{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
.tabs.fl{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent)}
.tabs.fl.fr{-webkit-mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.tab{padding:5px 11px;font-size:.84rem;gap:6px;border-color:transparent;background:transparent;color:var(--muted)}
.tab:hover{background:var(--surface);border-color:var(--border);color:var(--text)}
.tab .dot{width:8px;height:8px}
.tab .pct{font-size:.72rem;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.tab[aria-selected="true"] .pct{color:var(--bg);opacity:.7}
.tico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tsep{flex:0 0 1px;align-self:stretch;margin:4px 6px;background:var(--border)}
/* goal line now scrolls with the page */
.goal{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:14px 0 0;font-size:.86rem;color:var(--muted)}
.goal:empty{display:none}
.goal-k{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.goal-d{margin-left:auto;white-space:nowrap}
.goal-d b{color:var(--text)}
.legend{margin:10px 0 0}
.legend[hidden]{display:none}
.track-head{margin:14px 0 16px}
.track-head h2{font-size:1.2rem}
.sec-title{margin:18px 0 8px}
/* calendar grid can use the space the header gave back */
.wk-scroll{max-height:calc(100vh - 260px);min-height:360px}

@media (max-width:760px){
  .top{position:sticky}
  .bar1{flex-wrap:wrap;gap:8px;padding:8px 0 6px}

}

  {key:'doing',label:'In progress',cssVar:'--s-doing'},
  {key:'done',label:'Done',cssVar:'--s-done'},
  {key:'skipped',label:'Skipped',cssVar:'--s-skipped'}
];
const STORE_KEY='roadmap-progress-v1', CUSTOM_KEY='roadmap-custom-v2', THEME_KEY='roadmap-theme-v1', TAB_KEY='roadmap-tab-v1', VIEW_KEY='roadmap-view-v2';
const DAY=86400000;
const M_START='/*ROADMAP_'+'START*/', M_END='/*ROADMAP_'+'END*/';

function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return (h>>>0).toString(36);}
function clone(o){return JSON.parse(JSON.stringify(o));}
const BASE_HASH=hashStr(JSON.stringify(ROADMAP));

let DATA=null, TRACKS=[], META={}, INDEX={}, UNLOCKS={}, problems=[];
let custom=null;          // {baseHash, data}
let staleCustom=false;    // browser edits were made on an older file
let state={status:{},notes:{},checks:{},doneAt:{},sched:{}};
let viewOpts={hidden:{},hideDone:false,showBranches:true};
let currentTab='week', openId=null, lastFocus=null, panelMode='view', newDraft=null, hideTicked=false;
const history=[];

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function h(tag,attrs){
  const e=document.createElement(tag);
  const a=attrs||{};
  Object.keys(a).forEach(function(k){
    const v=a[k];
    if(v===false||v==null) return;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  });
  for(let i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(function(kid){
      if(kid==null||kid===false) return;
      e.append(kid.nodeType?kid:document.createTextNode(String(kid)));
    });
  }
  return e;
}
function safeUrl(u){return /^https?:\/\//i.test(u||'');}

/* ---------- data ---------- */
function useData(d){
  DATA=d; TRACKS=DATA.tracks||[]; META=DATA.meta||{};
  buildIndex();
}
function buildIndex(){
  INDEX={}; UNLOCKS={}; problems=[];
  TRACKS.forEach(function(t){(t.nodes||[]).forEach(function(n){
    if(INDEX[n.id]) problems.push('Duplicate id: '+n.id);
    INDEX[n.id]={node:n,track:t};
  });});
  TRACKS.forEach(function(t){(t.nodes||[]).forEach(function(n){
    (n.dependsOn||[]).forEach(function(d){
      if(!INDEX[d]) problems.push(n.id+' depends on unknown id '+d);
      else (UNLOCKS[d]=UNLOCKS[d]||[]).push(n.id);
    });
    if(n.attachTo&&!INDEX[n.attachTo]) problems.push(n.id+' attaches to unknown id '+n.attachTo);
    if(n.date&&!/^\d{4}-\d{2}-\d{2}$/.test(n.date)) problems.push(n.id+' has a bad date: '+n.date);
  });});
}
function loadCustom(){
  try{
    const raw=localStorage.getItem(CUSTOM_KEY);
    if(!raw) return;
    const c=JSON.parse(raw);
    if(!c||!c.data||!c.data.tracks) return;
    if(hashStr(JSON.stringify(c.data))===BASE_HASH){localStorage.removeItem(CUSTOM_KEY);return;}
    custom=c; staleCustom=(c.baseHash!==BASE_HASH);
  }catch(e){}
}
function saveCustom(){
  syncDirty();
  try{
    if(hashStr(JSON.stringify(DATA))===BASE_HASH){localStorage.removeItem(CUSTOM_KEY);custom=null;return;}
    custom={baseHash:custom&&staleCustom?custom.baseHash:BASE_HASH,data:DATA,savedAt:new Date().toISOString()};
    localStorage.setItem(CUSTOM_KEY,JSON.stringify(custom));
  }catch(e){toast('Could not save edits in this browser');}
}

/* ---------- progress storage ---------- */
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){const r=JSON.parse(raw); if(r&&typeof r==='object'){
      state.status=r.status||{}; state.notes=r.notes||{}; state.checks=r.checks||{}; state.doneAt=r.doneAt||{}; state.sched=r.sched||{};
    }}
  }catch(e){}
  try{const v=JSON.parse(localStorage.getItem(VIEW_KEY)||'null'); if(v) viewOpts=Object.assign(viewOpts,v);}catch(e){}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){} syncDirty();}
function saveView(){try{localStorage.setItem(VIEW_KEY,JSON.stringify(viewOpts));}catch(e){}}

/* ---------- dates ---------- */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayD(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function todayISO(){return iso(todayD());}
function daysUntil(s){return Math.round((parseD(s)-todayD())/DAY);}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return iso(d);}
function addMonths(s,n){const d=parseD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);}
function fmtDate(s){return parseD(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function fmtShort(s){return parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtDM(s){return parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function rel(n){
  if(n===0) return 'today';
  if(n===1) return 'tomorrow';
  if(n===-1) return 'yesterday';
  return n>0?('in '+n+' days'):(-n+' days overdue');
}

/* ---------- checklist + status ---------- */
function ckey(nid,iid){return nid+'::'+iid;}
function isTicked(nid,item){const v=state.checks[ckey(nid,item.id)];return v===undefined?!!item.done:!!v;}
function setTick(nid,item,on){
  const k=ckey(nid,item.id);
  if(on){ if(item.done&&state.checks[k]===undefined) return; state.checks[k]=todayISO(); }
  else{ if(item.done) state.checks[k]=false; else delete state.checks[k]; }
}
function clProg(n){
  const list=n.checklist||[]; let d=0;
  list.forEach(function(it){if(isTicked(n.id,it)) d++;});
  return {done:d,total:list.length};
}
function autoStatus(n){
  if(!n.checklist||!n.checklist.length) return 'todo';
  const p=clProg(n);
  return p.done===0?'todo':(p.done===p.total?'done':'doing');
}
function getStatus(id){
  const x=INDEX[id]; if(!x) return 'todo';
  return state.status[id]||autoStatus(x.node);
}
function statusLabel(k){const s=STATUSES.find(function(x){return x.key===k;});return s?s.label:k;}
function setStatusRaw(id,k){
  const n=INDEX[id]&&INDEX[id].node;
  if(n&&k===autoStatus(n)) delete state.status[id]; else state.status[id]=k;
  if(k==='done') state.doneAt[id]=todayISO(); else delete state.doneAt[id];
}
function setStatus(id,k){
  setStatusRaw(id,k); save(); renderAll();
  if(openId===id){const b=$('#panel [data-sbtn="'+k+'"]'); if(b) b.focus();}
}
function prog(nodes){
  let done=0,skipped=0;
  nodes.forEach(function(n){const s=getStatus(n.id); if(s==='done')done++; else if(s==='skipped')skipped++;});
  const active=nodes.length-skipped;
  return {done:done,skipped:skipped,active:active,pct:active?Math.round(done/active*100):0};
}
function allNodes(){const a=[];TRACKS.forEach(function(t){(t.nodes||[]).forEach(function(n){a.push(n);});});return a;}
function unmetDeps(n){
  return (n.dependsOn||[]).filter(function(d){const s=getStatus(d);return INDEX[d]&&s!=='done'&&s!=='skipped';});
}
function activity(days){
  const cut=addDays(todayISO(),-(days-1)); let ticks=0,steps=0;
  Object.keys(state.checks).forEach(function(k){const v=state.checks[k]; if(typeof v==='string'&&v>=cut) ticks++;});
  Object.keys(state.doneAt).forEach(function(k){if(state.doneAt[k]>=cut&&INDEX[k]) steps++;});
  return {ticks:ticks,steps:steps};
}

/* ---------- theme / toast ---------- */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);}
function initTheme(){
  let t=null; try{t=localStorage.getItem(THEME_KEY);}catch(e){}
  if(t!=='dark'&&t!=='light') t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  applyTheme(t);
}
function toggleTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  applyTheme(t); try{localStorage.setItem(THEME_KEY,t);}catch(e){}
}
let toastTimer=null;
function toastUndo(msg){
  const t=$('#toast');
  t.replaceChildren(h('span',{text:msg}),h('button',{class:'toast-btn',type:'button',text:'Undo',onclick:function(){ if(undo()) toast('Undone'); }}));
  t.classList.add('show','act');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show','act');},6000);
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.remove('act'); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},2600);
}

/* ---------- header, banner, legend, tabs ---------- */
function renderHeader(){
  $('#appTitle').textContent=META.title||'Roadmap';
  document.title=META.title||'Roadmap';
  const gl=$('#goalLine'); gl.replaceChildren();
  if(META.goal) gl.append(h('span',{class:'goal-k',text:'Goal'}),h('span',{text:META.goal}));
  if(META.goalDate){
    const d=daysUntil(META.goalDate);
    gl.append(h('span',{class:'goal-d'},h('b',{text:d>=0?d+' days':Math.abs(d)+' days past'}),' to '+fmtShort(META.goalDate)+(META.goalVerify?' (verify)':'')));
  }
  const p=prog(allNodes());
  $('#overallBar').style.width=p.pct+'%';
  $('#overallBarWrap').setAttribute('aria-valuenow',String(p.pct));
  $('#overallText').textContent=p.pct+'%';
  $('#ring').style.strokeDashoffset=String(94.25*(1-p.pct/100));
  $('#progChip').setAttribute('aria-label','Overall progress '+p.pct+' percent, '+p.done+' of '+p.active+' steps done. Open the whole roadmap.');
  $('#progChip').title='Overall '+p.pct+'%: '+p.done+' of '+p.active+' steps done'+(p.skipped?' ('+p.skipped+' skipped)':'')+'. Click for the whole roadmap.';
  $('#calNote').textContent=META.calendarNote||'';
}
function renderBanner(){
  const b=$('#banner'); b.replaceChildren();
  if(syncConflict) b.append(syncConflictBanner());
  if(!custom) return;
  if(syncOn()&&!staleCustom) return;   // edits are saved to GitHub, so no download reminder
  if(staleCustom){
    b.append(h('div',{class:'banner'},
      h('span',{text:'This file has a newer built-in roadmap than the edits saved in this browser.'}),
      h('span',{},
        h('button',{class:'btn small',type:'button',onclick:function(){staleCustom=false;saveCustom();renderAll();toast('Keeping your edits');},text:'Keep my edits'}),' ',
        h('button',{class:'btn small primary',type:'button',onclick:discardCustom,text:'Use the file version'}))));
  }else{
    b.append(h('div',{class:'banner'},
      h('span',{text:'You have edits saved in this browser only. Download the updated roadmap to keep them in the file.'}),
      h('span',{},
        h('button',{class:'btn small primary',type:'button',onclick:downloadRoadmap,text:'Download updated roadmap'}),' ',
        h('button',{class:'btn small',type:'button',onclick:discardCustom,text:'Discard edits'}))));
  }
}
function discardCustom(){
  if(!confirm('Throw away the step edits saved in this browser and use the version in the file? Your ticks and statuses stay.')) return;
  pushHistory();
  try{localStorage.removeItem(CUSTOM_KEY);}catch(e){}
  custom=null; staleCustom=false; useData(clone(ROADMAP)); syncDirty(); renderAll(); toast('Using the file version');
}
function renderLegend(){
  const lg=$('#legend'); lg.replaceChildren();
  STATUSES.forEach(function(s){
    const i=h('i'); i.style.setProperty('--c','var('+s.cssVar+')');
    lg.append(h('span',{},i,s.label));
  });
  lg.append(h('span',{},h('span',{class:'tag verify',text:'verify'}),'date or rule to double-check'));
}
function renderTabs(){
  const nav=$('#tabs'); nav.replaceChildren();
  const ICON={week:'M4 7h16M4 12h16M4 17h10',cal:'M5 6h14v13H5zM5 10h14M9 4v4M15 4v4',all:'M4 6h4v4H4zM10 8h10M4 14h4v4H4zM10 16h10'};
  const views=[{id:'week',name:'This week'},{id:'cal',name:'Calendar'},{id:'all',name:'Overview'}];
  views.forEach(function(t){
    const ic=document.createElementNS('http://www.w3.org/2000/svg','svg'); ic.setAttribute('viewBox','0 0 24 24'); ic.setAttribute('aria-hidden','true'); ic.setAttribute('class','tico');
    const pth=document.createElementNS('http://www.w3.org/2000/svg','path'); pth.setAttribute('d',ICON[t.id]); ic.append(pth);
    nav.append(h('button',{class:'tab view',type:'button',role:'tab','data-tab':t.id,'aria-controls':'view',tabindex:currentTab===t.id?'0':'-1','aria-selected':String(currentTab===t.id),onclick:function(){setTab(t.id);}},ic,t.name));
  });
  nav.append(h('span',{class:'tsep','aria-hidden':'true'}));
  TRACKS.forEach(function(t){
    const dot=h('span',{class:'dot'}); dot.style.setProperty('--tc',t.color||'var(--accent)');
    const short=t.short||t.name.split(/,| and /)[0].trim();
    nav.append(h('button',{class:'tab',type:'button',role:'tab','data-tab':t.id,'aria-controls':'view',tabindex:currentTab===t.id?'0':'-1',title:t.name,'aria-label':t.name+', '+prog(t.nodes).pct+' percent','aria-selected':String(currentTab===t.id),onclick:function(){setTab(t.id);}},
      dot,short,h('span',{class:'pct',text:prog(t.nodes).pct+'%'})));
  });
  const sel=nav.querySelector('[aria-selected="true"]');
  if(sel){ const l=sel.offsetLeft, r=l+sel.offsetWidth; if(l<nav.scrollLeft+8) nav.scrollLeft=l-24; else if(r>nav.scrollLeft+nav.clientWidth-8) nav.scrollLeft=r-nav.clientWidth+24; }
  fadeTabs();
}
// Left/Right/Home/End move between tabs (the usual keyboard pattern for a tab bar).
function tabKeys(e){
  const k=e.key; if(['ArrowRight','ArrowLeft','Home','End'].indexOf(k)<0||!e.target.closest('[role="tab"]')) return;
  const ids=[].slice.call($('#tabs').querySelectorAll('[role="tab"]')).map(function(b){return b.getAttribute('data-tab');});
  let i=ids.indexOf(currentTab);
  i=k==='Home'?0:k==='End'?ids.length-1:(i+(k==='ArrowRight'?1:-1)+ids.length)%ids.length;
  e.preventDefault(); setTab(ids[i]);
  const sel=$('#tabs [aria-selected="true"]'); if(sel) sel.focus();
}
function fadeTabs(){
  const n=$('#tabs'); if(!n) return;
  n.classList.toggle('fl',n.scrollLeft>4);
  n.classList.toggle('fr',n.scrollLeft+n.clientWidth<n.scrollWidth-4);
}
function setTab(id){
  currentTab=id; try{localStorage.setItem(TAB_KEY,id);}catch(e){}
  renderTabs(); renderView(); window.scrollTo(0,0); out().replaceChildren();
  // a track opens at the first unfinished step instead of the top
  const nx=$('#view .main.is-next');
  if(nx&&nx.closest('.row')!==$('#view .path .row')){
    window.scrollTo(0,Math.max(0,nx.getBoundingClientRect().top+window.scrollY-$('#top').offsetHeight-90));
  }
}

/* ---------- node pieces ---------- */
function miniProg(n){
  if(!n.checklist||!n.checklist.length) return null;
  const p=clProg(n); const b=h('b',{},h('i'));
  b.firstChild.style.width=Math.round(p.done/p.total*100)+'%';
  return h('span',{class:'mini',title:p.done+' of '+p.total+' ticked'},b,p.done+'/'+p.total);
}
function nodeButton(n,isBranch){
  const s=getStatus(n.id), unmet=unmetDeps(n);
  const meta=h('span',{class:'n-meta'});
  if(n.date) meta.append(fmtShort(n.date));
  if(n.verify) meta.append(h('span',{class:'tag verify',text:'verify'}));
  if(s!=='todo') meta.append(h('span',{class:'tag st',text:statusLabel(s)}));   // grey border already means not started
  const mp=miniProg(n); if(mp) meta.append(mp);
  if(unmet.length&&s!=='done'&&s!=='skipped'){
    const names=unmet.map(function(d){return INDEX[d].node.title;}).join(', ');
    meta.append(h('span',{class:'tag dep',text:'needs '+unmet.length,title:'Not finished yet: '+names}));
  }
  return h('button',{class:'node'+(isBranch?' branch':''),type:'button','data-status':s,'data-id':n.id,onclick:function(e){openPanel(n.id,e.currentTarget);}},
    h('span',{class:'n-title',text:n.title}),meta);
}
function nodeWrap(n,isBranch){ return h('div',{class:'nw'},nodeButton(n,isBranch),quickTick(n)); }
// One-click "done" on cards and timeline steps. Steps with a checklist open it instead,
// because their status follows the ticks.
function quickTick(n){
  const s=getStatus(n.id), hasCl=!!(n.checklist&&n.checklist.length), done=s==='done';
  const label=hasCl?'Open the checklist of "'+n.title+'"':(done?'Mark "'+n.title+'" as not done':'Mark "'+n.title+'" as done');
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('aria-hidden','true');
  const path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d',hasCl?'M8 7h10M8 12h10M8 17h10M4.5 7h.01M4.5 12h.01M4.5 17h.01':'M5 12.5l4.5 4.5L19 7.5'); svg.append(path);
  return h('button',{class:'qtick'+(done?' on':'')+(hasCl?' cl':''),type:'button','data-id':n.id,'aria-label':label,title:hasCl?'Open checklist':(done?'Mark as not done':'Mark as done'),
    onclick:function(e){
      e.stopPropagation();
      if(hasCl){ openPanel(n.id,e.currentTarget); const c=$('#panel .cl-head'); if(c) c.scrollIntoView({block:'start'}); return; }
      pushHistory(); setStatusRaw(n.id,done?'todo':'done'); save(); renderAll();
      toastUndo(done?'Marked not done: '+n.title:'Done: '+n.title);
      const again=document.querySelector('.qtick[data-id="'+CSS.escape(n.id)+'"]'); if(again) again.focus();
    }},svg);
}
function rowsFor(track){
  const rows=[]; let last=null;
  (track.nodes||[]).forEach(function(n){
    if(n.type==='branch'){
      let target=null;
      if(n.attachTo) target=rows.find(function(r){return r.main.id===n.attachTo;});
      if(!target) target=last;
      if(target){target.branches.push(n);return;}
    }
    last={main:n,branches:[]}; rows.push(last);
  });
  return rows;
}
function trackClTotals(t){
  let d=0,tot=0; (t.nodes||[]).forEach(function(n){const p=clProg(n); d+=p.done; tot+=p.total;});
  return {done:d,total:tot};
}

/* ---------- track view ---------- */
function renderTrack(t){
  const view=$('#view');
  const p=prog(t.nodes||[]), c=trackClTotals(t);
  const bar=h('div',{class:'bar'},h('span',{})); bar.firstChild.style.width=p.pct+'%';
  const head=h('div',{class:'track-head'},
    h('div',{class:'head-row'},h('h2',{text:t.name}),
      h('button',{class:'btn small',type:'button',onclick:function(e){lastFocus=e.currentTarget;startNew(t.id);},text:'+ Add step'})),
    h('p',{class:'muted blurb',text:t.blurb||''}),
    bar,
    h('div',{class:'small muted',text:p.pct+'% - '+p.done+' of '+p.active+' steps done'+(p.skipped?' ('+p.skipped+' skipped)':'')+(c.total?' | '+c.done+' of '+c.total+' checklist items ticked':'')}));
  head.style.setProperty('--tc',t.color);
  view.append(head);
  const bl=head.querySelector('.blurb');   // long descriptions show two lines with "More"
  if(bl&&bl.scrollHeight>bl.clientHeight+2){
    const more=h('button',{class:'linkbtn',type:'button','aria-expanded':'false',text:'More',onclick:function(){const o=bl.classList.toggle('open');more.textContent=o?'Less':'More';more.setAttribute('aria-expanded',String(o));}});
    bl.after(more);
  }
  const path=h('div',{class:'path'});
  const today=todayISO(); let todayShown=false, nextMarked=false;
  rowsFor(t).forEach(function(r){
    if(!todayShown&&r.main.date&&r.main.date>=today){ path.append(h('div',{class:'today path-today'},h('span',{text:'Today, '+fmtShort(today)}))); todayShown=true; }
    const st=getStatus(r.main.id), isNext=!nextMarked&&st!=='done'&&st!=='skipped';
    if(isNext) nextMarked=true;
    const main=h('div',{class:'main'+(isNext?' is-next':''),'data-status':st},nodeWrap(r.main,false));
    const row=h('div',{class:'row'},main);
    if(r.branches.length){
      const br=h('div',{class:'branches'});
      r.branches.forEach(function(b){br.append(nodeWrap(b,true));});
      row.append(br);
    }
    path.append(row);
  });
  if(!(t.nodes||[]).length) path.append(h('div',{class:'empty',text:'No steps yet. Use "+ Add step".'}));
  view.append(path);
}

/* ---------- week view ---------- */
function card(x){
  const n=x.node,t=x.track,s=getStatus(n.id),d=daysUntil(n.date);
  const tr=h('span',{class:'c-track'},h('i'),t.name); tr.firstChild.style.setProperty('--tc',t.color);
  const mp=miniProg(n), st=s!=='todo'?statusLabel(s):'';
  const b=h('button',{class:'card',type:'button','data-status':s,onclick:function(e){openPanel(n.id,e.currentTarget);}},
    tr,h('span',{class:'c-title',text:n.title}),
    h('span',{class:'c-when'+(d<0?' late':''),text:fmtDate(n.date)+' - '+rel(d)+(n.verify?' (verify)':'')}),
    (st||mp)?h('span',{class:'c-when'},st,st&&mp?' - ':'',mp):null);
  return h('div',{class:'cw'},b,quickTick(n));
}
function weekSection(title,items,emptyText){
  const view=$('#view');
  view.append(h('h3',{class:'sec-title'},title,h('span',{class:'count',text:items.length?'('+items.length+')':''})));
  if(!items.length){view.append(h('div',{class:'empty',text:emptyText}));return;}
  const g=h('div',{class:'cards'}); items.forEach(function(x){g.append(card(x));}); view.append(g);
}
function openItems(){
  const items=[];
  TRACKS.forEach(function(t){(t.nodes||[]).forEach(function(n){
    const s=getStatus(n.id); if(n.date&&s!=='done'&&s!=='skipped') items.push({node:n,track:t});
  });});
  return items;

/* ---------- mutations ---------- */
function makeId(trackId,title){
  let base=(trackId+'-'+title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')).slice(0,40).replace(/-$/,'');
  let id=base,i=2; while(INDEX[id]) id=base+'-'+(i++);
  INDEX[id]={node:{id:id},track:null};
  return id;
}
function removeFromTrack(id){TRACKS.forEach(function(t){t.nodes=(t.nodes||[]).filter(function(n){return n.id!==id;});});}
function insertNode(trackId,node){
  const t=TRACKS.find(function(z){return z.id===trackId;}); if(!t) return;
  t.nodes=t.nodes||[]; t.nodes.push(node); resortTrack(t);
}
function resortTrack(t){
  // keep main steps in date order; side steps stay right after the main step they attach to
  const mains=t.nodes.filter(function(n){return n.type!=='branch';});
  const branches=t.nodes.filter(function(n){return n.type==='branch';});
  mains.sort(function(a,b){return (a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:0;});
  const out=[];
  mains.forEach(function(m){out.push(m); branches.filter(function(b){return b.attachTo===m.id;}).forEach(function(b){out.push(b);});});
  branches.forEach(function(b){if(out.indexOf(b)<0) out.push(b);});

const STOP={the:1,a:1,an:1,my:1,step:1,steps:1,of:1,to:1,and:1,on:1,in:1,for:1,with:1,task:1,node:1,problem:1,it:1,i:1,ive:1,just:1};

function words(s){
  return String(s).toLowerCase().replace(/([0-9])([a-z])/g,'$1 $2').replace(/([a-z])([0-9])/g,'$1 $2').replace(/[^a-z0-9+#]+/g,' ').trim().split(/\s+/)

function score(q,text,id){
  const ql=q.toLowerCase().trim(); if(!ql) return 0;

  let hit=0; qw.forEach(function(w){hit+=wordHit(w,tw);});

function parseDuration(s){

function parseDateText(s,refISO){
  let t=String(s).toLowerCase().trim().replace(/,/g,' ').replace(/\s+/g,' ').replace(/(\d)(st|nd|rd|th)\b/g,'$1').replace(/\bof\b/g,' ').replace(/\s+/g,' ').trim();

  m=t.match(/^end (?:the )?month$/); if(m){const d=todayD();return iso(new Date(d.getFullYear(),d.getMonth()+1,0));}
  m=t.match(/^(\d{1,2})[ \/.-]?([a-z]{3,})\.?(?: (\d{4}))?$/) || null;

  if(m){day=+m[1];mon=MONTHS.indexOf(m[2].slice(0,3));yr=m[3]?+m[3]:null;}
  else{
    m=t.match(/^([a-z]{3,})\.? (\d{1,2})(?: (\d{4}))?$/);
    if(m){mon=MONTHS.indexOf(m[1].slice(0,3));day=+m[2];yr=m[3]?+m[3]:null;}
    else{
      m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(m){day=+m[1];mon=+m[2]-1;yr=+m[3];}

    const ref=refISO&&refISO>today?refISO:today; const ry=+ref.slice(0,4);

  }
  const d=new Date(yr,mon,day); if(d.getMonth()!==mon) return null;
  return iso(d);
}

    let rm=target.match(/^(.+?)\s+and\s+(?:everything|all|the rest|all steps)\s*(?:after it|after that|after|that follows?)?$/i);
    if(rm){
      return pick(findNodes(rm[1]),'a step called "'+rm[1]+'"',function(c){
        const x=INDEX[c.id]; const from=x.node.date;
        shiftList(openSteps(function(n){return INDEX[n.id].track===x.track&&n.date>=from;}),dur,sign,stepLabel(c.id)+' and later steps in '+x.track.name);
      });
    }
    return pick(findNodes(target),'a step called "'+target+'"',function(c){shiftList([c.id],dur,sign,stepLabel(c.id));});
  }
  // move to a date or a track
  if((m=q.match(/^(?:move|reschedule|set|change|put)\s+(?:the\s+)?(?:date\s+(?:of|for)\s+)?(.+)$/i))&&/\s(to|on|for|into)\s/i.test(m[1])){
    const body=m[1]; const re=/\s+(?:to|on|for|into)\s+/gi; const cuts=[]; let x;
    while((x=re.exec(body))) cuts.push({a:x.index,b:x.index+x[0].length});
    for(let i=cuts.length-1;i>=0;i--){
      const target=body.slice(0,cuts[i].a), dest=body.slice(cuts[i].b);
      const d=parseDateText(dest);
      if(d) return pick(findNodes(target),'a step called "'+target+'"',function(c){
        pushHistory(); const n=INDEX[c.id].node; const old=n.date; n.date=d; resortTrack(INDEX[c.id].track); commit();
        done('Moved '+stepLabel(c.id)+(old?' from '+fmtShort(old):'')+' to '+fmtDate(d)+'.');
      });
    }
    for(let i=cuts.length-1;i>=0;i--){
      const target=body.slice(0,cuts[i].a), dest=body.slice(cuts[i].b);
      const tr=findTrack(dest);
      if(tr) return pick(findNodes(target),'a step called "'+target+'"',function(c){
        pushHistory(); const n=INDEX[c.id].node; removeFromTrack(c.id); delete n.type; delete n.attachTo; insertNode(tr.id,n); commit();
        done('Moved '+stepLabel(c.id)+' to the '+tr.name+' track.');
      });
    }
    const last=cuts[cuts.length-1];
    if(!statusWord(body.slice(last.b).replace(/^as\s+/i,''))) return showMsg('I did not understand "'+body.slice(last.b)+'" as a date or a track. Try 20 dec, 2027-01-15, next friday or in 2 weeks.',{err:true});
  }
  // open
  if((m=q.match(/^(?:open|show|find|go to|where is)\s+(.+)$/i))){
    const all=findNodes(m[1]).concat(findItems(m[1])).sort(function(a,b){return b.s-a.s;});
    return pick(all,'anything called "'+m[1]+'"',function(c){ out().replaceChildren(); goTo(c.kind==='item'?c.nid:c.id); });
  }
  // untick
  if((m=q.match(/^(?:untick|uncheck|unmark|undo tick(?: on)?)\s+(.+)$/i))) return doStatus(m[1],'todo');
  // status: "mark X as done" / "set X to in progress"
  if((m=q.match(/^(?:mark|set)\s+(.+?)\s+(?:as\s+|to\s+)?(done|complete|completed|finished|in progress|doing|started|skipped|skip|not started|todo|to do|not done)$/i))) return doStatus(m[1],statusWord(m[2]));
  // status: verb first
  if((m=q.match(/^(done|finished|finish|completed|complete|solved|did|ticked?|check off|checked|watched|start|started|starting|begin|began|skip|skipped|reset|undone)\s+(?:with\s+|on\s+)?(.+)$/i))){
    let w=m[1].toLowerCase(); let st=/^(tick|ticked|check off|checked|watched)$/.test(w)?'done':statusWord(w.replace(/^starting$/,'start').replace(/^began$/,'begin'));
    return doStatus(m[2],st||'done');
  }
  // status: verb last ("pandas done", "unit 5 is finished")
  if((m=q.match(/^(.+?)\s+(?:is\s+|are\s+)?(done|finished|completed|complete|solved|in progress|started|skipped|not started)$/i))) return doStatus(m[1],statusWord(m[2]));
  // fallback: maybe it's a step name
  const guess=findNodes(q).concat(findItems(q)).sort(function(a,b){return b.s-a.s;});
  if(guess.length&&guess[0].s>=70){
    const g=guess[0];
    return showMsg('I found '+(g.kind==='item'?'"'+g.item.label+'"':stepLabel(g.id))+'. What should happen to it?',
      {choices:[{label:'Mark done',fn:function(){doStatus(g.kind==='item'?g.item.label:g.id,'done');}},
                {label:'Open it',fn:function(){out().replaceChildren();goTo(g.kind==='item'?g.nid:g.id);}}]});
  }
  showMsg(['I did not understand that. Type "help" to see the kinds of instructions I know, or ask the AI assistant.'],{err:true,choices:aiChoice()});
}

const SCHED_HOURS={start:6,end:23};
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let calMode='week', calAnchor=null, clockTimer=null, lastRemind='';
state.sched=state.sched||{};

function schedAll(){return Object.keys(state.sched).map(function(k){return state.sched[k];});}
function nowHM(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function hmToMin(hm){const p=String(hm||'00:00').split(':').map(Number);return p[0]*60+(p[1]||0);}
function minToHM(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function fmtHM(hm){const m=hmToMin(hm);let hh=Math.floor(m/60),mm=m%60;const ap=hh>=12?'pm':'am';hh=hh%12||12;return hh+(mm?':'+pad(mm):'')+ap;}
function fmtDur(mins){if(mins%60===0) return (mins/60)+' h';if(mins>60) return Math.floor(mins/60)+' h '+(mins%60)+' min';return mins+' min';}
function weekStart(isoDate){const d=parseD(isoDate);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return iso(d);}
function occursOn(b,dateISO){
  if(dateISO<b.date) return false;
  if(b.until&&dateISO>b.until) return false;
  if(b.skip&&b.skip[dateISO]) return false;
  const r=b.repeat||'none';
  if(r==='none') return dateISO===b.date;
  const wd=parseD(dateISO).getDay();
  if(r==='daily') return true;
  if(r==='weekdays') return wd>=1&&wd<=5;
  if(r==='weekly') return (b.days&&b.days.length)?b.days.indexOf(wd)>-1:wd===parseD(b.date).getDay();
  return false;
}
function occurrences(fromISO,toISO){
  const out=[]; const all=schedAll();
  for(let d=fromISO; d<=toISO; d=addDays(d,1)){
    all.forEach(function(b){ if(occursOn(b,d)) out.push({b:b,date:d,key:b.id+'@'+d,done:!!(b.done&&b.done[d])}); });
  }
  out.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:hmToMin(x.b.start)-hmToMin(y.b.start);});
  return out;
}
function blockTrack(b){
  if(b.stepId&&INDEX[b.stepId]) return INDEX[b.stepId].track;
  if(b.trackId) return TRACKS.find(function(t){return t.id===b.trackId;})||null;
  return null;
}
function blockColor(b){const t=blockTrack(b);return t?t.color:'var(--accent)';}
function blockTitle(b){ if(b.title) return b.title; if(b.stepId&&INDEX[b.stepId]) return INDEX[b.stepId].node.title; return 'Study block'; }
function newBlockId(){let i=1;while(state.sched['s'+i]) i++;return 's'+i;}
function addBlock(o){
  const b={id:newBlockId(),title:o.title||'',date:o.date||todayISO(),start:o.start||'19:00',mins:o.mins||60,repeat:o.repeat||'none',days:o.days||[],until:o.until||'',stepId:o.stepId||'',trackId:o.trackId||'',note:o.note||'',done:{},skip:{}};
  state.sched[b.id]=b; save(); return b;
}
function stepBlocks(stepId){return schedAll().filter(function(b){return b.stepId===stepId;});}

function sessionList(occ){
  const tl=h('div',{class:'today-list'}), nowM=hmToMin(nowHM());

    const s=hmToMin(o.b.start),e=s+o.b.mins;

      h('span',{class:'tm',text:fmtHM(o.b.start)+' - '+fmtHM(minToHM(e))}),
      h('span',{},h('b',{text:blockTitle(o.b)}),o.b.stepId&&INDEX[o.b.stepId]&&o.b.title?h('span',{class:'small muted',text:' - '+INDEX[o.b.stepId].node.title}):null,o.done?h('span',{class:'small muted',text:' (done)'}):null));

function dueOn(dateISO){
  const out=[]; TRACKS.forEach(function(t){(t.nodes||[]).forEach(function(n){if(n.date===dateISO) out.push({node:n,track:t});});}); return out;

function renderWeekGrid(view,ndays){
  const start=ndays===1?calAnchor:weekStart(calAnchor), today=todayISO();

  occ.forEach(function(o){const s=Math.floor(hmToMin(o.b.start)/60),e=Math.ceil((hmToMin(o.b.start)+o.b.mins)/60);if(s<hs)hs=s;if(e>he)he=e;});

  days.forEach(function(d){
    const col=h('div',{class:'wk-col'+(d===today?' is-today':'')}); col.style.height=((he-hs)*HH)+'px';
    col.addEventListener('click',function(e){

        h('b',{text:blockTitle(o.b)}),h('span',{text:fmtHM(o.b.start)+' - '+fmtHM(minToHM(s+o.b.mins))+(o.b.repeat&&o.b.repeat!=='none'?' - repeats':'')}));

    }

  });

  setTimeout(function(){const nl=document.getElementById('nowline'); if(nl) scroll.scrollTop=Math.max(0,parseFloat(nl.style.top)-150);},0);

/* ---------- ics export ---------- */

function exportICS(){
  const from=addDays(todayISO(),-7), to=addDays(todayISO(),120);
  const occ=occurrences(from,to);
  if(!occ.length) return toast('Nothing scheduled to export');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Roadmap//EN','CALSCALE:GREGORIAN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  occ.forEach(function(o){
    const endMin=hmToMin(o.b.start)+o.b.mins;   // may pass midnight: the end then falls on a later date
    const ds=o.date.replace(/-/g,''), st=o.b.start.replace(':','');
    const de=addDays(o.date,Math.floor(endMin/1440)).replace(/-/g,''), en=minToHM(endMin).replace(':','');

/* ---------- schedule instructions ---------- */
function parseTimeTok(s){
  const m=String(s).trim().toLowerCase().match(/^(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?$/); if(!m) return null;
  let hh=+m[1],mm=m[2]?+m[2]:0; if(hh>23||mm>59) return null;
  if(m[3]==='pm'&&hh<12) hh+=12; if(m[3]==='am'&&hh===12) hh=0;

}

  const m=String(s).toLowerCase().match(/^(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)$/); if(!m) return null;

    const a=parseTimeTok(m[1]),b=parseTimeTok(m[2]); if(a&&b){o.start=a;o.mins=((hmToMin(b)-hmToMin(a))+1440)%1440||60;s=s.replace(m[0],' ');}

  if(!o.start&&(m=s.match(/ (\d{1,2}(?:[:.]\d{2})?\s*(?:am|pm)) /))){o.start=parseTimeTok(m[1]);s=s.replace(m[0],' ');}
  if(!o.start&&(m=s.match(/ (\d{1,2}[:.]\d{2}) /))){o.start=parseTimeTok(m[1]);s=s.replace(m[0],' ');}
  if(/ (every day|daily|everyday) /.test(s)){o.repeat='daily';s=s.replace(/ (every day|daily|everyday) /,' ');}
  else if(/ (weekdays|every weekday|on weekdays|mon to fri|mon-fri) /.test(s)){o.repeat='weekdays';s=s.replace(/ (weekdays|every weekday|on weekdays|mon to fri|mon-fri) /,' ');}
  else if((m=s.match(/ (?:every|each) ((?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*(?:days?)?(?: and | & | |\/)?)+)(?= |$)/))){
    const ds=[]; m[1].replace(/(mon|tue|wed|thu|fri|sat|sun)/g,function(x){ds.push(WD.indexOf(x));});

function describeBlock(o){

  const finish=function(stepId,title,trackId){
    const b={stepId:stepId||'',title:stepId?'':(title||'Study block'),trackId:trackId||'',date:o.date,start:o.start,mins:o.mins,repeat:o.repeat||'none',days:o.days||[],until:o.until||''};

    let s=score(ql,blockTitle(b)); if(b.stepId&&INDEX[b.stepId]) s=Math.max(s,score(ql,INDEX[b.stepId].node.title));
    const t=blockTrack(b); if(t&&(trackExact(ql)===t)) s=Math.max(s,80);
    if(s>=45) out.push({kind:'block',b:b,s:s,label:blockTitle(b)+' ('+(b.repeat&&b.repeat!=='none'?b.repeat+' ':'')+fmtHM(b.start)+')'});

    const t=todayISO(); const occ=occurrences(t,t).filter(function(o){return score(m[1],blockTitle(o.b))>=45||(o.b.stepId&&INDEX[o.b.stepId]&&score(m[1],INDEX[o.b.stepId].node.title)>=45);});

/* ---------- panel open/close ---------- */
// While the panel is open the page behind it is inert (no clicks, no Tab, hidden
// from screen readers); while it is closed the panel itself is inert.
function setPanelInert(open){
  $('#panel').inert=!open;
  ['#top','main','footer'].forEach(function(s){const e=$(s); if(e) e.inert=open;});
}
function panelFocusables(){
  return [].slice.call($('#panel').querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])'))
    .filter(function(e){return !e.disabled&&e.offsetParent!==null;});

  const first=f[0], last=f[f.length-1], a=document.activeElement;
  if(e.shiftKey&&(a===first||!$('#panel').contains(a))){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&(a===last||!$('#panel').contains(a))){e.preventDefault();first.focus();}
}

  $('#scrim').classList.add('show'); $('#panel').scrollTop=0;

  if(panelMode==='block'){const f=$('#panel form select'); if(f) f.focus();}
}

function exportProgress(){

/* Shape checks for data that comes from outside this page (backups, sync).
   They throw instead of guessing, so a damaged file changes nothing. */
function isISO(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parseD(s))&&iso(parseD(s))===s;}
function cleanProgress(d){
  if(!d||typeof d!=='object'||!d.status||typeof d.status!=='object') throw new Error('this is not a progress backup');
  const valid=STATUSES.map(function(s){return s.key;});
  const st={},nt={},ck={},da={};
  Object.keys(d.status).forEach(function(k){const v=d.status[k]; if(valid.indexOf(v)>-1) st[k]=v;});
  Object.keys(d.notes||{}).forEach(function(k){if(typeof d.notes[k]==='string'&&d.notes[k]) nt[k]=d.notes[k];});
  Object.keys(d.checks||{}).forEach(function(k){const v=d.checks[k]; if(v===false||typeof v==='string') ck[k]=v;});
  Object.keys(d.doneAt||{}).forEach(function(k){if(typeof d.doneAt[k]==='string') da[k]=d.doneAt[k];});

}

    const b=s[k], bad=function(why){throw new Error('calendar block "'+k+'" is damaged ('+why+')');};
    if(!b||typeof b!=='object') bad('not an object');

    const mins=Number(b.mins); if(!(mins>=5&&mins<=1440)) bad('length');
    const rep=b.repeat||'none'; if(['none','daily','weekdays','weekly'].indexOf(rep)<0) bad('repeat');
    const days=Array.isArray(b.days)?b.days.filter(function(x){return x===0||(x>=1&&x<=6&&x%1===0);}):[];
    if(b.until&&!isISO(b.until)) bad('until');
    const map=function(m){const o={}; if(m&&typeof m==='object') Object.keys(m).forEach(function(d){if(isISO(d)&&m[d]) o[d]=true;}); return o;};
    out[k]={id:k,title:String(b.title||''),date:b.date,start:b.start,mins:mins,repeat:rep,days:days,until:b.until||'',
      stepId:String(b.stepId||''),trackId:String(b.trackId||''),note:String(b.note||''),done:map(b.done),skip:map(b.skip)};

function checkRoadmap(r){

  if(!r||typeof r!=='object'||!Array.isArray(r.tracks)||!r.tracks.length) bad('no tracks');
  const seen={};
  r.tracks.forEach(function(t){
    if(!t||typeof t.id!=='string'||typeof t.name!=='string'||!Array.isArray(t.nodes)) bad('track');
    t.nodes.forEach(function(n){
      if(!n||typeof n.id!=='string'||!n.id||typeof n.title!=='string') bad('step');
      if(seen[n.id]) bad('duplicate id '+n.id); seen[n.id]=1;
      if(n.date!=null&&!isISO(n.date)) bad('date of '+n.id);

function importProgress(file){

function fmtJSON(v,ind){

  if(Array.isArray(v)) return '[\n'+v.map(function(x){return nx+fmtJSON(x,nx);}).join(',\n')+'\n'+ind+']';
  return '{\n'+Object.keys(v).map(function(k){return nx+JSON.stringify(k)+': '+fmtJSON(v[k],nx);}).join(',\n')+'\n'+ind+'}';
}

function need(id){ if(!id||!INDEX[id]||!INDEX[id].track) throw new Error('No step with id "'+id+'". Use search.'); return INDEX[id]; }
function needDate(s,what){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')||isNaN(parseD(s))) throw new Error((what||'date')+' must be YYYY-MM-DD, got "'+s+'"'); return s; }
function needTrack(q){
  const t=TRACKS.find(function(z){return z.id===q||z.name.toLowerCase()===String(q).toLowerCase();})||findTrack(String(q||''));
  if(!t) throw new Error('No track "'+q+'". Tracks: '+TRACKS.map(function(z){return z.id;}).join(', ')); return t;
}
function needBlock(id){ const b=state.sched[id]; if(!b) throw new Error('No calendar block "'+id+'".'); return b; }

function applyStepFields(n,a,trackId){
  if(a.title!=null){ const t=String(a.title).trim(); if(!t) throw new Error('title cannot be empty'); n.title=t; }
  if(a.date!=null){ if(a.date==='') delete n.date; else n.date=needDate(a.date); }
  if(a.what!=null) n.what=String(a.what);
  if(a.why!=null) n.why=String(a.why);
  if(a.actions!=null) n.actions=strArr(a.actions,'actions');
  if(a.links!=null){
    if(!Array.isArray(a.links)) throw new Error('links must be a list');
    n.resources=a.links.map(function(l){ const o={label:String(l.label||l.url||'').trim()}; if(l.url){ if(!safeUrl(l.url)) throw new Error('bad url '+l.url); o.url=String(l.url);} return o; }).filter(function(o){return o.label;});
  }
  if(a.depends_on!=null){
    const d=strArr(a.depends_on,'depends_on'); d.forEach(function(x){ if(x===n.id) throw new Error('a step cannot depend on itself'); need(x); });
    if(d.length) n.dependsOn=d; else delete n.dependsOn;
  }
  if(a.verify!=null){ if(a.verify) n.verify=true; else delete n.verify; }
  if(a.side_step_of!=null){
    if(a.side_step_of===''){ delete n.type; delete n.attachTo; }
    else{
      const m=need(a.side_step_of);
      if(m.node.id===n.id||m.node.type==='branch') throw new Error('side_step_of must be a main step');
      if(m.track.id!==trackId) throw new Error('side_step_of must be in track '+trackId);

  }
}
function blockFields(b,a){

  if(a.track!=null){ b.trackId=a.track?needTrack(a.track).id:''; }
  if(a.date!=null) b.date=needDate(a.date);
  if(a.start!=null){ const m=String(a.start).match(/^(\d{1,2}):(\d{2})$/); if(!m||+m[1]>23||+m[2]>59) throw new Error('start must be HH:MM (24h)'); b.start=pad(+m[1])+':'+m[2]; }

  if(a.repeat!=null){ if(['none','daily','weekdays','weekly'].indexOf(a.repeat)<0) throw new Error('bad repeat'); b.repeat=a.repeat; }
  if(a.days!=null){ b.days=strArr(a.days,'days').map(function(d){const i=WD.indexOf(d.toLowerCase().slice(0,3)); if(i<0) throw new Error('bad day '+d); return i;}); }

const AI_IMPL={
  search:function(a){

    } else resortTrack(oldTrack);
    commit(); aiChanges.push('Updated "'+n.title+'"'+(a.date?' (due '+fmtDM(n.date)+')':''));
    return {ok:true,step:aiStepLine(n).slice(2),track:newTrack.id};

  add_step:function(a){

  delete_step:function(a){

  shift_dates:function(a){
